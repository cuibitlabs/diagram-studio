name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build
      - name: Build the type gallery
        run: npm run gallery
      - name: Publish the studio with the gallery alongside it
        run: cp -r docs/gallery dist/gallery
      # Pages must be switched on once, by hand, at
      # Settings → Pages → Source: GitHub Actions.
      #
      # `enablement: true` looks like it would automate this and does not: the
      # default GITHUB_TOKEN cannot create a Pages site even with `pages: write`,
      # and fails with "Resource not accessible by integration", which is a worse
      # message than the one you get without it. Left explicit so nobody spends
      # the afternoon rediscovering that.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
