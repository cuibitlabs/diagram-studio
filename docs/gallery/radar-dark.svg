<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 864 800" width="864" height="800" role="img" aria-labelledby="radar-dark-title radar-dark-desc" style="--paper:#111512;--panel:#1a201c;--ink:#f1efe7;--muted:#a3ada5;--accent:#ff7557;--accent-2:#64d8b0;--line:#3d453f;--line-strong:#c9d1ca;--on-accent:#16110f;--corner:8px">
  <title id="radar-dark-title">Radar overview</title>
