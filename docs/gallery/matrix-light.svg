<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1024 760" width="1024" height="760" role="img" aria-labelledby="matrix-light-title matrix-light-desc" style="--font-sans:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;--font-serif:'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;--sketch:url(#matrix-light-sketch);--paper:#f3f0e9;--panel:#fffdf8;--ink:#1d211f;--muted:#5f665f;--accent:#c2452a;--accent-2:#174f46;--line:#c3bfb5;--line-strong:#3a403c;--on-accent:#fffdf8;--corner:8px">
  <title id="matrix-light-title">Consultant matrix overview</title>
  <desc id="matrix-light-desc">Four named strategies against two axes</desc>
  <defs>
    
    <marker id="matrix-light-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="matrix-light-arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 10 1 L 1 5 L 10 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="matrix-light-arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
    </marker>
    <marker id="matrix-light-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="var(--accent)"/>
    </marker>
    <marker id="matrix-light-crowfoot" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 12 1 L 2 7 L 12 13 M 2 7 H 12" fill="none" stroke="var(--line-strong)" stroke-width="1.2"/>
    </marker>
    <marker id="matrix-light-bar" markerWidth="10" markerHeight="14" refX="6" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 6 1 V 13" fill="none" stroke="var(--line-strong)" stroke-width="1.4"/>
    </marker>
    <pattern id="matrix-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c3bfb5" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <pattern id="matrix-light-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 V 8" stroke="#c3bfb5" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <filter id="matrix-light-sketch" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>.canvas-bg{fill:var(--paper)}.canvas-grid{pointer-events:none}text{fill:var(--ink)}.diagram-title-text{fill:var(--ink)}.diagram-lede{fill:var(--muted)}.ds-node .card{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.ds-node .card-rim{fill:none;stroke:var(--line);stroke-width:1.25}.ds-node.is-dashed .card{stroke-dasharray:6 6}.ds-node .node-title{fill:var(--ink)}.ds-node .node-sub{fill:var(--muted)}.ds-node .node-icon{color:var(--muted)}.ds-node.tone-accent .card{fill:var(--accent);stroke:var(--accent)}.ds-node.tone-accent .node-title,.ds-node.tone-accent .node-sub{fill:var(--on-accent)}.ds-node.tone-muted .card{fill:var(--paper)}.ds-node.tone-muted .node-title{fill:var(--muted)}.ds-node.role-external .card,.ds-node.role-optional .card,.ds-node.role-legacy .card{stroke-dasharray:6 6}.ds-node.role-legacy .node-title{fill:var(--muted)}.ds-node.role-security .card{stroke:var(--accent-2);stroke-width:1.5}.ds-node.role-store .card{fill:var(--paper)}.ds-node.is-selected .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node .node-badge rect{fill:var(--paper);stroke:var(--line)}.ds-node .badge-text{fill:var(--muted)}.ds-edge .line{fill:none;stroke:var(--line-strong);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:butt}.ds-edge .edge-hit{fill:none;stroke:transparent;stroke-width:14}.ds-edge.is-dashed .line{stroke-dasharray:7 6}.ds-edge.tone-accent .line{stroke:var(--accent);stroke-width:2}.ds-edge.kind-weak .line{stroke:var(--line);stroke-width:1}.ds-edge.is-selected .line{stroke:var(--accent-2);stroke-width:2.5}.ds-edge .edge-label rect{fill:var(--paper);stroke:none}.ds-edge .edge-label-text{fill:var(--muted)}.lane rect,.group rect{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}.lane.is-filled rect{fill:var(--panel);stroke-dasharray:none}.lane-title{fill:var(--muted)}.plot-bg{fill:var(--panel);stroke:var(--line);stroke-width:1}.axis-line{fill:none;stroke:var(--line-strong);stroke-width:1.25}.grid-line{fill:none;stroke:var(--line);stroke-width:1}.axis-label,.caption{fill:var(--muted)}.mark{fill:var(--accent-2)}.mark.is-focus{fill:var(--accent)}.mark-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.mark-area{fill:var(--accent);fill-opacity:.12;stroke:none}.mark-label{fill:var(--muted)}.mark-value{fill:var(--ink)}.lifeline{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 6}.activation{fill:var(--panel);stroke:var(--line);stroke-width:1}.timeline-axis{fill:none;stroke:var(--line-strong);stroke-width:1.25}.timeline-stem{fill:none;stroke:var(--line);stroke-width:1}.timeline-dot{fill:var(--paper);stroke:var(--line-strong);stroke-width:1.5}.timeline-dot.is-focus{fill:var(--accent);stroke:var(--accent)}.set-ring{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}.set-ring.set-1{fill:var(--accent-2);stroke:var(--accent-2)}.set-ring.set-2{fill:var(--ink);stroke:var(--ink);fill-opacity:.08}.set-label{fill:var(--ink)}.tier{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.tier.is-focus{fill:var(--accent);stroke:var(--accent)}.tier-label{fill:var(--ink)}.tier.is-focus .tier-label{fill:var(--on-accent)}.hub{fill:var(--accent-2);stroke:none}.hub-label{fill:var(--on-accent)}.legend-swatch{fill:var(--accent)}.legend-swatch.is-secondary{fill:var(--accent-2)}.legend-swatch.is-muted{fill:var(--line)}.legend-label{fill:var(--muted)}.entity-header{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.entity-header.is-focus{fill:var(--accent);stroke:var(--accent)}.entity-row{fill:none;stroke:var(--line);stroke-width:1}.entity-field{fill:var(--ink)}.entity-type{fill:var(--muted)}.style-terminal{--font-sans:var(--font-mono);--font-serif:var(--font-mono)}.style-terminal .card{fill:none;stroke-width:1.5}.style-terminal .card-rim,.style-terminal .plot-bg{fill:none}.style-terminal .ds-node.tone-accent .card{fill:none;stroke:var(--accent);stroke-width:2.5}.style-terminal .ds-node.tone-accent .node-title,.style-terminal .ds-node.tone-accent .node-sub{fill:var(--accent)}.style-terminal .edge-label rect{fill:var(--paper)}.style-terminal .tier,.style-terminal .entity-header{fill:none}.style-terminal .tier.is-focus,.style-terminal .entity-header.is-focus{fill:none;stroke:var(--accent)}.style-terminal .tier.is-focus .tier-label{fill:var(--accent)}.style-sketchy .card,.style-sketchy .line,.style-sketchy .tier,.style-sketchy .set-ring{filter:var(--sketch)}.style-sketchy .lane rect{filter:var(--sketch)}.annotation-text{fill:var(--muted)}.annotation-rule{stroke:var(--accent);stroke-width:2;fill:none}.annotation-leader{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:3 4}@keyframes ds-reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes ds-flow{to{stroke-dashoffset:-28}}.motion-reveal .ds-node,.motion-reveal .ds-edge{animation:ds-reveal .5s ease both;animation-delay:calc(var(--step,0)*.14s)}.motion-loop .ds-edge .line{stroke-dasharray:6 8;animation:ds-flow 1.6s linear infinite}.motion-loop .ds-edge.tone-accent .line{animation-duration:1.1s}@media (prefers-reduced-motion: reduce){.motion-reveal .ds-node,.motion-reveal .ds-edge{animation:none;opacity:1;transform:none}.motion-loop .ds-edge .line{animation:none;stroke-dasharray:none}}.editor-overlay{pointer-events:none}.snap-guide{fill:none;stroke:var(--accent-2);stroke-width:1;stroke-dasharray:3 4}.marquee{fill:var(--accent-2);fill-opacity:.08;stroke:var(--accent-2);stroke-width:1;stroke-dasharray:4 4}.message-mask{fill:var(--paper)}.stepping .ds-node,.stepping .ds-edge{transition:opacity .3s ease}.stepping.no-motion .ds-node,.stepping.no-motion .ds-edge{transition:none}.ds-node.is-pending,.ds-edge.is-pending{opacity:.1}.ds-node[data-node-id]{cursor:grab}.ds-node[data-node-id]:focus-visible .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node[data-node-id]:focus{outline:none}.ds-edge[data-edge-id]{cursor:pointer}</style>
  <rect class="canvas-bg" x="0" y="0" width="1024" height="760"/>
  
  
  <g class="diagram-content"><text class="axis-label" x="512" y="656" text-anchor="middle" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:700;letter-spacing:1.2px">COST TO RUN</text>
      <text class="axis-label" x="152" y="638" text-anchor="start" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:600;letter-spacing:1px">LOW</text>
      <text class="axis-label" x="872" y="638" text-anchor="end" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:600;letter-spacing:1px">HIGH</text>
      <g transform="translate(124 356) rotate(-90)"><text class="axis-label" x="0" y="0" text-anchor="middle" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:700;letter-spacing:1.2px">BUSINESS VALUE</text></g>
      <text class="axis-label" x="140" y="108" text-anchor="end" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:600;letter-spacing:1px">HIGH</text>
      <text class="axis-label" x="140" y="612" text-anchor="end" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:600;letter-spacing:1px">LOW</text>
      <g class="ds-node matrix-cell tone-accent " data-node-id="node-ck-yyv1" tabindex="0" role="button" aria-label="Transform">
          <path class="card" d="M 160 96 H 496 A 8 8 0 0 1 504 104 V 340 A 8 8 0 0 1 496 348 H 160 A 8 8 0 0 1 152 340 V 104 A 8 8 0 0 1 160 96 Z"/>
          <text class="node-title" x="176" y="136" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:16px;font-weight:700">Transform</text>
          <text class="node-sub" x="176" y="164" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">High value to the business and expensive to keep as it</text><text class="node-sub" x="176" y="180" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">is.</text>
          <text class="node-sub" x="176" y="324" text-anchor="start" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:500">Fund a rebuild</text>
        </g><g class="ds-node matrix-cell  " data-node-id="node-cl-yyv1" tabindex="0" role="button" aria-label="Optimise">
          <path class="card" d="M 528 96 H 864 A 8 8 0 0 1 872 104 V 340 A 8 8 0 0 1 864 348 H 528 A 8 8 0 0 1 520 340 V 104 A 8 8 0 0 1 528 96 Z"/>
          <text class="node-title" x="544" y="136" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:16px;font-weight:700">Optimise</text>
          <text class="node-sub" x="544" y="164" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">Valuable and healthy. Small investments compound</text><text class="node-sub" x="544" y="180" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">here.</text>
          <text class="node-sub" x="544" y="324" text-anchor="start" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:500">Invest incrementally</text>
        </g><g class="ds-node matrix-cell  " data-node-id="node-cm-yyv1" tabindex="0" role="button" aria-label="Maintain">
          <path class="card" d="M 160 364 H 496 A 8 8 0 0 1 504 372 V 608 A 8 8 0 0 1 496 616 H 160 A 8 8 0 0 1 152 608 V 372 A 8 8 0 0 1 160 364 Z"/>
          <text class="node-title" x="176" y="404" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:16px;font-weight:700">Maintain</text>
          <text class="node-sub" x="176" y="432" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">Low value but low cost. Leave it alone.</text>
          <text class="node-sub" x="176" y="592" text-anchor="start" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:500">Hold</text>
        </g><g class="ds-node matrix-cell  " data-node-id="node-cn-yyv1" tabindex="0" role="button" aria-label="Retire">
          <path class="card" d="M 528 364 H 864 A 8 8 0 0 1 872 372 V 608 A 8 8 0 0 1 864 616 H 528 A 8 8 0 0 1 520 608 V 372 A 8 8 0 0 1 528 364 Z"/>
          <text class="node-title" x="544" y="404" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:16px;font-weight:700">Retire</text>
          <text class="node-sub" x="544" y="432" text-anchor="start" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">Low value and high cost to run.</text>
          <text class="node-sub" x="544" y="592" text-anchor="start" style="font-family:var(--font-mono,'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace);font-size:12px;font-weight:500">Plan an exit</text>
        </g></g>
  
</svg>
