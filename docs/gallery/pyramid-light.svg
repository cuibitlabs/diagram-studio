          <text class="tier-label" x="476" y="168" text-anchor="middle" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">Why this exists</text>
          
        </g><g class="ds-node pyramid-level" data-node-id="node-az-yyv1" tabindex="0" role="button" aria-label="Strategy">
