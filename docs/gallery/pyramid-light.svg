          <text class="tier-label" x="476" y="376" text-anchor="middle" style="font-family:var(--font-sans,Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);font-size:12px;font-weight:500">Funded bets</text>
          
