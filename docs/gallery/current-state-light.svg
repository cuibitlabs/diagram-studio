<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1496 480" width="1496" height="480" role="img" aria-labelledby="current-state-light-title current-state-light-desc" style="--paper:#f3f0e9;--panel:#fffdf8;--ink:#1d211f;--muted:#5f665f;--accent:#c2452a;--accent-2:#174f46;--line:#c3bfb5;--line-strong:#3a403c;--on-accent:#fffdf8;--corner:8px">
  <title id="current-state-light-title">Current state overview</title>
  <desc id="current-state-light-desc">Legacy landscape with its constraints made explicit</desc>
  <defs>
    
    <marker id="current-state-light-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="current-state-light-arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 10 1 L 1 5 L 10 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="current-state-light-arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
    </marker>
    <marker id="current-state-light-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="var(--accent)"/>
    </marker>
    <marker id="current-state-light-crowfoot" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
