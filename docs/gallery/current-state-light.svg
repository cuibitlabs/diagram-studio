  </g><g class="constraint-note" data-note-for="node-19-h7ah"><text class="axis-label" x="376" y="188" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">▲ Overlapping ownership</text></g><g class="constraint-note" data-note-for="node-1a-h7ah"><text class="axis-label" x="656" y="188" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">▲ Single release window</text></g><g class="constraint-note" data-note-for="node-1b-h7ah"><text class="axis-label" x="936" y="196" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">▲ No shared identity</text></g><g class="constraint-note" data-note-for="node-1c-h7ah"><text class="axis-label" x="1216" y="188" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">▲ Reconciled by hand</text></g></g>
