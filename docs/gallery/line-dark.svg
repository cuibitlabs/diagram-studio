<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1112 688" width="1112" height="688" role="img" aria-labelledby="line-dark-title line-dark-desc" style="--paper:#111512;--panel:#1a201c;--ink:#f1efe7;--muted:#a3ada5;--accent:#ff7557;--accent-2:#64d8b0;--line:#3d453f;--line-strong:#c9d1ca;--on-accent:#16110f;--corner:8px">
  <title id="line-dark-title">Line chart overview</title>
