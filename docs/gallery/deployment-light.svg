  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 108 260 H 252 A 8 8 0 0 1 260 268 V 328 A 8 8 0 0 1 252 336 H 108 A 8 8 0 0 1 100 328 V 268 A 8 8 0 0 1 108 260 Z"/>
    <text class="node-title" x="120" y="289.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Build</text><text class="node-sub" x="120" y="317.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Artefact produced</text>
