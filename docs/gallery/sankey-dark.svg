<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1296 768" width="1296" height="768" role="img" aria-labelledby="sankey-dark-title sankey-dark-desc" style="--font-sans:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;--font-serif:'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;--sketch:url(#sankey-dark-sketch);--paper:#111512;--paper-2:#20261f;--panel:#1a201c;--ink:#f1efe7;--muted:#a3ada5;--soft:#b3bdb5;--accent:#ff7557;--accent-tint:rgba(255,117,87,0.14);--accent-2:#64d8b0;--link:#7fb6ef;--line:#3d453f;--line-strong:#c9d1ca;--on-accent:#16110f;--series-0:#8fb4c4;--series-1:#c4a274;--series-2:#a2bd8a;--corner:8px">
  <title id="sankey-dark-title">Sankey overview</title>
