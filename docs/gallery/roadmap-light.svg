<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="roadmap-light-title roadmap-light-desc" style="--paper:#f3f0e9;--panel:#fffdf8;--ink:#1d211f;--muted:#5f665f;--accent:#c2452a;--accent-2:#174f46;--line:#c3bfb5;--line-strong:#3a403c;--on-accent:#fffdf8;--corner:8px">
  <title id="roadmap-light-title">Roadmap overview</title>
  <desc id="roadmap-light-desc">Initiatives grouped by delivery horizon</desc>
  <defs>
    <marker id="roadmap-light-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="roadmap-light-arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 10 1 L 1 5 L 10 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="roadmap-light-arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
    </marker>
    <marker id="roadmap-light-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="var(--accent)"/>
    </marker>
    <marker id="roadmap-light-crowfoot" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 12 1 L 2 7 L 12 13 M 2 7 H 12" fill="none" stroke="var(--line-strong)" stroke-width="1.2"/>
    </marker>
    <marker id="roadmap-light-bar" markerWidth="10" markerHeight="14" refX="6" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 6 1 V 13" fill="none" stroke="var(--line-strong)" stroke-width="1.4"/>
    </marker>
    <pattern id="roadmap-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c3bfb5" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <pattern id="roadmap-light-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 V 8" stroke="#c3bfb5" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <style>.canvas-bg{fill:var(--paper)}.canvas-grid{pointer-events:none}text{fill:var(--ink)}.diagram-title-text{fill:var(--ink)}.diagram-lede{fill:var(--muted)}.ds-node .card{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.ds-node .card-rim{fill:none;stroke:var(--line);stroke-width:1.25}.ds-node.is-dashed .card{stroke-dasharray:6 6}.ds-node .node-title{fill:var(--ink)}.ds-node .node-sub{fill:var(--muted)}.ds-node .node-icon{color:var(--muted)}.ds-node.tone-accent .card{fill:var(--accent);stroke:var(--accent)}.ds-node.tone-accent .node-title,.ds-node.tone-accent .node-sub{fill:var(--on-accent)}.ds-node.tone-muted .card{fill:var(--paper)}.ds-node.tone-muted .node-title{fill:var(--muted)}.ds-node.role-external .card,.ds-node.role-optional .card{stroke-dasharray:6 6}.ds-node.role-security .card{stroke:var(--accent-2);stroke-width:1.5}.ds-node.role-store .card{fill:var(--paper)}.ds-node.is-selected .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node .node-badge rect{fill:var(--paper);stroke:var(--line)}.ds-node .badge-text{fill:var(--muted)}.ds-edge .line{fill:none;stroke:var(--line-strong);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:butt}.ds-edge .edge-hit{fill:none;stroke:transparent;stroke-width:14}.ds-edge.is-dashed .line{stroke-dasharray:7 6}.ds-edge.tone-accent .line{stroke:var(--accent);stroke-width:2}.ds-edge.kind-weak .line{stroke:var(--line);stroke-width:1}.ds-edge.is-selected .line{stroke:var(--accent-2);stroke-width:2.5}.ds-edge .edge-label rect{fill:var(--paper);stroke:none}.ds-edge .edge-label-text{fill:var(--muted)}.lane rect,.group rect{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}.lane.is-filled rect{fill:var(--panel);stroke-dasharray:none}.lane-title{fill:var(--muted)}.plot-bg{fill:var(--panel);stroke:var(--line);stroke-width:1}.axis-line{fill:none;stroke:var(--line-strong);stroke-width:1.25}.grid-line{fill:none;stroke:var(--line);stroke-width:1}.axis-label,.caption{fill:var(--muted)}.mark{fill:var(--accent-2)}.mark.is-focus{fill:var(--accent)}.mark-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.mark-area{fill:var(--accent);fill-opacity:.12;stroke:none}.mark-label{fill:var(--muted)}.mark-value{fill:var(--ink)}.lifeline{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 6}.activation{fill:var(--panel);stroke:var(--line);stroke-width:1}.timeline-axis{fill:none;stroke:var(--line-strong);stroke-width:1.25}.timeline-stem{fill:none;stroke:var(--line);stroke-width:1}.timeline-dot{fill:var(--paper);stroke:var(--line-strong);stroke-width:1.5}.timeline-dot.is-focus{fill:var(--accent);stroke:var(--accent)}.set-ring{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}.set-ring.set-1{fill:var(--accent-2);stroke:var(--accent-2)}.set-ring.set-2{fill:var(--ink);stroke:var(--ink);fill-opacity:.08}.set-label{fill:var(--ink)}.tier{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.tier.is-focus{fill:var(--accent);stroke:var(--accent)}.tier-label{fill:var(--ink)}.tier.is-focus .tier-label{fill:var(--on-accent)}.hub{fill:var(--accent-2);stroke:none}.hub-label{fill:var(--on-accent)}.legend-swatch{fill:var(--accent)}.legend-swatch.is-secondary{fill:var(--accent-2)}.legend-swatch.is-muted{fill:var(--line)}.legend-label{fill:var(--muted)}.entity-header{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.entity-header.is-focus{fill:var(--accent);stroke:var(--accent)}.entity-row{fill:none;stroke:var(--line);stroke-width:1}.entity-field{fill:var(--ink)}.entity-type{fill:var(--muted)}.ds-node[data-node-id]{cursor:grab}.ds-node[data-node-id]:focus-visible .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node[data-node-id]:focus{outline:none}.ds-edge[data-edge-id]{cursor:pointer}</style>
  <rect class="canvas-bg" x="0" y="0" width="960" height="480"/>
  
  
  <g class="diagram-content"><g class="lane is-filled" data-horizon="Now">
        <rect x="96" y="96" width="240" height="244" rx="10"/>
        <text class="lane-title" x="116" y="128" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:1.2px">NOW</text>
        <text class="axis-label" x="316" y="128" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">2 initiatives</text>
        <path class="grid-line" d="M 96 140 H 336"/>
      </g><g class="lane " data-horizon="Next">
        <rect x="360" y="96" width="240" height="244" rx="10"/>
        <text class="lane-title" x="380" y="128" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:1.2px">NEXT</text>
        <text class="axis-label" x="580" y="128" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">2 initiatives</text>
        <path class="grid-line" d="M 360 140 H 600"/>
      </g><g class="lane " data-horizon="Later">
        <rect x="624" y="96" width="240" height="244" rx="10"/>
        <text class="lane-title" x="644" y="128" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:1.2px">LATER</text>
        <text class="axis-label" x="844" y="128" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">1 initiative</text>
        <path class="grid-line" d="M 624 140 H 864"/>
      </g><g class="ds-node shape-box tone-accent">
    <path class="card" d="M 124 168 H 308 A 8 8 0 0 1 316 176 V 224 A 8 8 0 0 1 308 232 H 124 A 8 8 0 0 1 116 224 V 176 A 8 8 0 0 1 124 168 Z"/>
    <text class="node-title" x="136" y="203.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Single sign-on</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 124 248 H 308 A 8 8 0 0 1 316 256 V 304 A 8 8 0 0 1 308 312 H 124 A 8 8 0 0 1 116 304 V 256 A 8 8 0 0 1 124 248 Z"/>
    <text class="node-title" x="136" y="283.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Audit trail</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 388 168 H 572 A 8 8 0 0 1 580 176 V 232 A 8 8 0 0 1 572 240 H 388 A 8 8 0 0 1 380 232 V 176 A 8 8 0 0 1 388 168 Z"/>
    <text class="node-title" x="400" y="197.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Self-serve</text><text class="node-title" x="400" y="217.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">provisioning</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 388 256 H 572 A 8 8 0 0 1 580 264 V 312 A 8 8 0 0 1 572 320 H 388 A 8 8 0 0 1 380 312 V 264 A 8 8 0 0 1 388 256 Z"/>
    <text class="node-title" x="400" y="291.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Usage analytics</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 652 168 H 836 A 8 8 0 0 1 844 176 V 224 A 8 8 0 0 1 836 232 H 652 A 8 8 0 0 1 644 224 V 176 A 8 8 0 0 1 652 168 Z"/>
    <text class="node-title" x="664" y="203.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Partner marketplace</text>
  </g></g>
</svg>
