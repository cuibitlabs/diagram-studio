          <text class="axis-label" x="178" y="248" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">1</text>
        </g><g class="ds-edge sequence-message" data-edge-id="edge-3p-v9fz">
          <path class="edge-hit" d="M 376 296 H 584"/>
          <path class="line" d="M 376 296 H 584" marker-end="url(#sequence-light-arrow)"/>
          <rect class="message-mask" x="428.8" y="270" width="102.39999999999999" height="20" rx="6"/><text class="edge-label-text" x="480" y="284" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">authenticate</text>
          <text class="axis-label" x="386" y="312" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">2</text>
        </g><g class="ds-edge sequence-message" data-edge-id="edge-3q-v9fz">
          <path class="edge-hit" d="M 584 360 H 792"/>
          <path class="line" d="M 584 360 H 792" marker-end="url(#sequence-light-arrow)"/>
          <rect class="message-mask" x="629.6" y="334" width="116.8" height="20" rx="6"/><text class="edge-label-text" x="688" y="348" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">lookup account</text>
          <text class="axis-label" x="594" y="376" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">3</text>
        </g><g class="ds-edge sequence-message is-dashed" data-edge-id="edge-3r-v9fz">
          <path class="edge-hit" d="M 792 424 H 584"/>
          <path class="line" d="M 792 424 H 584" marker-end="url(#sequence-light-arrow-open)"/>
          <rect class="message-mask" x="654.8" y="398" width="66.4" height="20" rx="6"/><text class="edge-label-text" x="688" y="412" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">profile</text>
          <text class="axis-label" x="782" y="440" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">4</text>
        </g><g class="ds-edge sequence-message is-dashed" data-edge-id="edge-3s-v9fz">
          <path class="edge-hit" d="M 584 488 H 376"/>
          <path class="line" d="M 584 488 H 376" marker-end="url(#sequence-light-arrow-open)"/>
          <rect class="message-mask" x="425.2" y="462" width="109.6" height="20" rx="6"/><text class="edge-label-text" x="480" y="476" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">session token</text>
          <text class="axis-label" x="574" y="504" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">5</text>
        </g><g class="ds-edge sequence-message is-dashed" data-edge-id="edge-3t-v9fz">
          <path class="edge-hit" d="M 376 552 H 168"/>
          <path class="line" d="M 376 552 H 168" marker-end="url(#sequence-light-arrow-open)"/>
          <rect class="message-mask" x="231.6" y="526" width="80.8" height="20" rx="6"/><text class="edge-label-text" x="272" y="540" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">signed in</text>
          <text class="axis-label" x="366" y="568" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:500">6</text>
        </g><g class="ds-node shape-stadium tone-default role-actor">
    <path class="card" d="M 128 96 H 208 A 32 32 0 0 1 240 128 V 128 A 32 32 0 0 1 208 160 H 128 A 32 32 0 0 1 96 128 V 128 A 32 32 0 0 1 128 96 Z"/>
    <text class="node-title" x="168" y="125.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Cust</text><text class="node-title" x="168" y="145.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">omer</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 312 96 H 440 A 8 8 0 0 1 448 104 V 152 A 8 8 0 0 1 440 160 H 312 A 8 8 0 0 1 304 152 V 104 A 8 8 0 0 1 312 96 Z"/>
    <text class="node-title" x="376" y="131.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Web app</text>
  </g><g class="ds-node shape-box tone-accent">
    <path class="card" d="M 520 96 H 648 A 8 8 0 0 1 656 104 V 152 A 8 8 0 0 1 648 160 H 520 A 8 8 0 0 1 512 152 V 104 A 8 8 0 0 1 520 96 Z"/>
    <text class="node-title" x="584" y="131.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Auth service</text>
  </g><g class="ds-node shape-cylinder tone-default role-store">
    <path class="card" d="M 720 108.8 A 72 12.8 0 0 1 864 108.8 V 147.2 A 72 12.8 0 0 1 720 147.2 Z"/><path class="card-rim" d="M 720 108.8 A 72 12.8 0 0 0 864 108.8"/>
    <text class="node-title" x="792" y="143.92" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Account store</text>
  </g></g>
</svg>
