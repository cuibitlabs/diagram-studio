  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 676 164 H 812 A 8 8 0 0 1 820 172 V 220 A 8 8 0 0 1 812 228 H 676 A 8 8 0 0 1 668 220 V 172 A 8 8 0 0 1 676 164 Z"/>
    <text class="node-title" x="744" y="199.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Strategic bets</text>
  </g><g class="ds-node shape-box tone-default">
