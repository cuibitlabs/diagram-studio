    <text class="node-title" x="304" y="523.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Fill-ins</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 692 512 H 828 A 8 8 0 0 1 836 520 V 568 A 8 8 0 0 1 828 576 H 692 A 8 8 0 0 1 684 568 V 520 A 8 8 0 0 1 692 512 Z"/>
    <text class="node-title" x="760" y="547.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Avoid</text>
  </g></g>
