      <text class="axis-label" x="152" y="680" text-anchor="start" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600;letter-spacing:1px">LOW EFFORT</text>
      <text class="axis-label" x="912" y="680" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600;letter-spacing:1px">HIGH EFFORT</text>
      <g transform="translate(124 376) rotate(-90)"><text class="axis-label" x="0" y="0" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:700;letter-spacing:1.2px">VALUE</text></g>
      <text class="axis-label" x="140" y="108" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600;letter-spacing:1px">HIGH VALUE</text>
      <text class="axis-label" x="140" y="652" text-anchor="end" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600;letter-spacing:1px">LOW VALUE</text>
      <g class="ds-node shape-box tone-accent">
