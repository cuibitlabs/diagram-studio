<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 640 784" width="640" height="784" role="img" aria-labelledby="flowchart-dark-title flowchart-dark-desc" style="--paper:#111512;--panel:#1a201c;--ink:#f1efe7;--muted:#a3ada5;--accent:#ff7557;--accent-2:#64d8b0;--line:#3d453f;--line-strong:#c9d1ca;--on-accent:#16110f;--corner:8px">
  <title id="flowchart-dark-title">Flowchart overview</title>
  <desc id="flowchart-dark-desc">Decisions and process logic</desc>
  <defs>
    
    <marker id="flowchart-dark-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="flowchart-dark-arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 10 1 L 1 5 L 10 9 Z" fill="var(--line-strong)"/>
    </marker>
    <marker id="flowchart-dark-arrow-open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/>
    </marker>
    <marker id="flowchart-dark-dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="var(--accent)"/>
    </marker>
    <marker id="flowchart-dark-crowfoot" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 12 1 L 2 7 L 12 13 M 2 7 H 12" fill="none" stroke="var(--line-strong)" stroke-width="1.2"/>
    </marker>
    <marker id="flowchart-dark-bar" markerWidth="10" markerHeight="14" refX="6" refY="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 6 1 V 13" fill="none" stroke="var(--line-strong)" stroke-width="1.4"/>
    </marker>
    <pattern id="flowchart-dark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#3d453f" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <pattern id="flowchart-dark-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 V 8" stroke="#3d453f" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <style>.canvas-bg{fill:var(--paper)}.canvas-grid{pointer-events:none}text{fill:var(--ink)}.diagram-title-text{fill:var(--ink)}.diagram-lede{fill:var(--muted)}.ds-node .card{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.ds-node .card-rim{fill:none;stroke:var(--line);stroke-width:1.25}.ds-node.is-dashed .card{stroke-dasharray:6 6}.ds-node .node-title{fill:var(--ink)}.ds-node .node-sub{fill:var(--muted)}.ds-node .node-icon{color:var(--muted)}.ds-node.tone-accent .card{fill:var(--accent);stroke:var(--accent)}.ds-node.tone-accent .node-title,.ds-node.tone-accent .node-sub{fill:var(--on-accent)}.ds-node.tone-muted .card{fill:var(--paper)}.ds-node.tone-muted .node-title{fill:var(--muted)}.ds-node.role-external .card,.ds-node.role-optional .card{stroke-dasharray:6 6}.ds-node.role-security .card{stroke:var(--accent-2);stroke-width:1.5}.ds-node.role-store .card{fill:var(--paper)}.ds-node.is-selected .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node .node-badge rect{fill:var(--paper);stroke:var(--line)}.ds-node .badge-text{fill:var(--muted)}.ds-edge .line{fill:none;stroke:var(--line-strong);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:butt}.ds-edge .edge-hit{fill:none;stroke:transparent;stroke-width:14}.ds-edge.is-dashed .line{stroke-dasharray:7 6}.ds-edge.tone-accent .line{stroke:var(--accent);stroke-width:2}.ds-edge.kind-weak .line{stroke:var(--line);stroke-width:1}.ds-edge.is-selected .line{stroke:var(--accent-2);stroke-width:2.5}.ds-edge .edge-label rect{fill:var(--paper);stroke:none}.ds-edge .edge-label-text{fill:var(--muted)}.lane rect,.group rect{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}.lane.is-filled rect{fill:var(--panel);stroke-dasharray:none}.lane-title{fill:var(--muted)}.plot-bg{fill:var(--panel);stroke:var(--line);stroke-width:1}.axis-line{fill:none;stroke:var(--line-strong);stroke-width:1.25}.grid-line{fill:none;stroke:var(--line);stroke-width:1}.axis-label,.caption{fill:var(--muted)}.mark{fill:var(--accent-2)}.mark.is-focus{fill:var(--accent)}.mark-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.mark-area{fill:var(--accent);fill-opacity:.12;stroke:none}.mark-label{fill:var(--muted)}.mark-value{fill:var(--ink)}.lifeline{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 6}.activation{fill:var(--panel);stroke:var(--line);stroke-width:1}.timeline-axis{fill:none;stroke:var(--line-strong);stroke-width:1.25}.timeline-stem{fill:none;stroke:var(--line);stroke-width:1}.timeline-dot{fill:var(--paper);stroke:var(--line-strong);stroke-width:1.5}.timeline-dot.is-focus{fill:var(--accent);stroke:var(--accent)}.set-ring{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}.set-ring.set-1{fill:var(--accent-2);stroke:var(--accent-2)}.set-ring.set-2{fill:var(--ink);stroke:var(--ink);fill-opacity:.08}.set-label{fill:var(--ink)}.tier{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.tier.is-focus{fill:var(--accent);stroke:var(--accent)}.tier-label{fill:var(--ink)}.tier.is-focus .tier-label{fill:var(--on-accent)}.hub{fill:var(--accent-2);stroke:none}.hub-label{fill:var(--on-accent)}.legend-swatch{fill:var(--accent)}.legend-swatch.is-secondary{fill:var(--accent-2)}.legend-swatch.is-muted{fill:var(--line)}.legend-label{fill:var(--muted)}.entity-header{fill:var(--panel);stroke:var(--line);stroke-width:1.25}.entity-header.is-focus{fill:var(--accent);stroke:var(--accent)}.entity-row{fill:none;stroke:var(--line);stroke-width:1}.entity-field{fill:var(--ink)}.entity-type{fill:var(--muted)}.ds-node[data-node-id]{cursor:grab}.ds-node[data-node-id]:focus-visible .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node[data-node-id]:focus{outline:none}.ds-edge[data-edge-id]{cursor:pointer}</style>
  <rect class="canvas-bg" x="0" y="0" width="640" height="784"/>
  
  
  <g class="diagram-content"><g class="ds-edge" data-edge-id="edge-28-lmow">
    <path class="edge-hit" d="M 222 160 L 222 256"/>
    <path class="line" d="M 222 160 L 222 256" marker-end="url(#flowchart-dark-arrow)"/>
    
  </g><g class="ds-edge" data-edge-id="edge-29-lmow">
    <path class="edge-hit" d="M 208 368 L 208 464"/>
    <path class="line" d="M 208 368 L 208 464" marker-end="url(#flowchart-dark-arrow)"/>
    <g class="edge-label"><rect x="216" y="405" width="30.4" height="22" rx="6"/><text class="edge-label-text" x="231.2" y="420.2" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">no</text></g>
  </g><g class="ds-edge" data-edge-id="edge-2a-lmow">
    <path class="edge-hit" d="M 344 312 L 344 496"/>
    <path class="line" d="M 344 312 L 344 496" marker-end="url(#flowchart-dark-arrow)"/>
    <g class="edge-label"><rect x="352" y="393" width="37.6" height="22" rx="6"/><text class="edge-label-text" x="370.8" y="408.2" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">yes</text></g>
  </g><g class="ds-edge" data-edge-id="edge-2b-lmow">
    <path class="edge-hit" d="M 430 528 L 430 624"/>
    <path class="line" d="M 430 528 L 430 624" marker-end="url(#flowchart-dark-arrow)"/>
    
  </g><g class="ds-edge is-dashed" data-edge-id="edge-2c-lmow">
    <path class="edge-hit" d="M 232 464 L 232 368"/>
    <path class="line" d="M 232 464 L 232 368" marker-end="url(#flowchart-dark-arrow)"/>
    <g class="edge-label"><rect x="240" y="405" width="73.6" height="22" rx="6"/><text class="edge-label-text" x="276.8" y="420.2" text-anchor="middle" style="font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;font-size:12px;font-weight:600">resubmit</text></g>
  </g><g class="ds-node shape-stadium tone-default role-terminal">
    <path class="card" d="M 148 96 H 296 A 32 32 0 0 1 328 128 V 128 A 32 32 0 0 1 296 160 H 148 A 32 32 0 0 1 116 128 V 128 A 32 32 0 0 1 148 96 Z"/>
    <text class="node-title" x="222" y="125.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Request</text><text class="node-title" x="222" y="145.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">received</text>
  </g><g class="ds-node shape-diamond tone-default role-decision">
    <path class="card" d="M 220 256 L 344 312 L 220 368 L 96 312 Z"/>
    <text class="node-title" x="220" y="305.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Fields</text><text class="node-title" x="220" y="325.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">complete?</text>
  </g><g class="ds-node shape-box tone-default">
    <path class="card" d="M 148 464 H 292 A 8 8 0 0 1 300 472 V 520 A 8 8 0 0 1 292 528 H 148 A 8 8 0 0 1 140 520 V 472 A 8 8 0 0 1 148 464 Z"/>
    <text class="node-title" x="160" y="499.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Return errors</text>
  </g><g class="ds-node shape-box tone-accent">
    <path class="card" d="M 356 464 H 504 A 8 8 0 0 1 512 472 V 520 A 8 8 0 0 1 504 528 H 356 A 8 8 0 0 1 348 520 V 472 A 8 8 0 0 1 356 464 Z"/>
    <text class="node-title" x="368" y="499.12" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Process request</text>
  </g><g class="ds-node shape-stadium tone-default role-terminal">
    <path class="card" d="M 356 624 H 508 A 32 32 0 0 1 540 656 V 656 A 32 32 0 0 1 508 688 H 356 A 32 32 0 0 1 324 656 V 656 A 32 32 0 0 1 356 624 Z"/>
    <text class="node-title" x="432" y="653.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Confirmation</text><text class="node-title" x="432" y="673.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">sent</text>
  </g></g>
</svg>
