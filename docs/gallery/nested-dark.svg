          <text class="node-title" x="176" y="174" text-anchor="start" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:14px;font-weight:700">Experience layer</text>
