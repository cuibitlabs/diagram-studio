    <text class="node-title" x="1084" y="145.12" text-anchor="middle" style="font-family:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:16px;font-weight:700">Warehouse</text>
  </g><g class="ds-node shape-parallelogram tone-default role-output">
