<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1544 480" width="1544" height="480" role="img" aria-labelledby="data-flow-dark-title data-flow-dark-desc" style="--paper:#111512;--panel:#1a201c;--ink:#f1efe7;--muted:#a3ada5;--accent:#ff7557;--accent-2:#64d8b0;--line:#3d453f;--line-strong:#c9d1ca;--on-accent:#16110f;--corner:8px">
  <title id="data-flow-dark-title">Data flow overview</title>
