<svg xmlns="http://www.w3.org/2000/svg" class="ds-svg" viewBox="0 0 1120 576" width="1120" height="576" role="img" aria-labelledby="gantt-light-title gantt-light-desc" style="--font-sans:Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:'Geist Mono', ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;--font-serif:'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;--sketch:url(#gantt-light-sketch);--paper:#f3f0e9;--paper-2:#e7e3da;--panel:#fffdf8;--ink:#1d211f;--muted:#5f665f;--soft:#5a615d;--accent:#c2452a;--accent-tint:rgba(194,69,42,0.09);--accent-2:#174f46;--link:#1a4b9c;--line:#c3bfb5;--line-strong:#3a403c;--on-accent:#fffdf8;--series-0:#5d7c8a;--series-1:#8a6f4e;--series-2:#6c7f5a;--corner:8px">
  <title id="gantt-light-title">Gantt overview</title>
  <desc id="gantt-light-desc">Tasks against a declared time scale</desc>
  <defs>
    
