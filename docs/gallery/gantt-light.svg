r(--muted)}.entity-header{fill:var(--paper-2);stroke:var(--line);stroke-width:1.25}.entity-header.is-focus{fill:var(--accent);stroke:var(--accent)}.entity-row{fill:none;stroke:var(--line);stroke-width:1}.entity-field{fill:var(--ink)}.entity-type{fill:var(--muted)}.style-terminal{--font-sans:var(--font-mono);--font-serif:var(--font-mono)}.style-terminal .card{fill:none;stroke-width:1.5}.style-terminal .card-rim,.style-terminal .plot-bg{fill:none}.style-terminal .ds-node.tone-accent .card{fill:none;stroke:var(--accent);stroke-width:2.5}.style-terminal .ds-node.tone-accent .node-title,.style-terminal .ds-node.tone-accent .node-sub{fill:var(--accent)}.style-terminal .edge-label rect{fill:var(--paper)}.style-terminal .tier,.style-terminal .entity-header{fill:none}.style-terminal .tier.is-focus,.style-terminal .entity-header.is-focus{fill:none;stroke:var(--accent)}.style-terminal .tier.is-focus .tier-label{fill:var(--accent)}.style-sketchy .card,.style-sketchy .line,.style-sketchy .tier,.style-sketchy .set-ring{filter:var(--sketch)}.style-sketchy .lane rect{filter:var(--sketch)}.plate-rule{fill:none;stroke:var(--line);stroke-width:1}.plate-tick{fill:none;stroke:var(--accent);stroke-width:1}.plate-label{fill:var(--ink)}.plate-spec{fill:var(--soft)}.annotation-text{fill:var(--muted)}.annotation-rule{stroke:var(--accent);stroke-width:2;fill:none}.annotation-leader{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:3 4}@keyframes ds-reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes ds-flow{to{stroke-dashoffset:-28}}.motion-reveal .ds-node,.motion-reveal .ds-edge{animation:ds-reveal .5s ease both;animation-delay:calc(var(--step,0)*.14s)}.motion-loop .ds-edge .line{stroke-dasharray:6 8;animation:ds-flow 1.6s linear infinite}.motion-loop .ds-edge.tone-accent .line{animation-duration:1.1s}.motion-ready .motion-step .ds-node,.motion-ready .motion-step .ds-edge{opacity:.12;transition:opacity .3s ease}.motion-ready .motion-step .ds-node.is-shown,.motion-ready .motion-step .ds-edge.is-shown{opacity:1}@media (prefers-reduced-motion: reduce){.motion-reveal .ds-node,.motion-reveal .ds-edge{animation:none;opacity:1;transform:none}.motion-loop .ds-edge .line{animation:none;stroke-dasharray:none}.motion-ready .motion-step .ds-node,.motion-ready .motion-step .ds-edge{transition:none}}@media print{.motion-ready .motion-step .ds-node,.motion-ready .motion-step .ds-edge{opacity:1}}.editor-overlay{pointer-events:none}.snap-guide{fill:none;stroke:var(--accent-2);stroke-width:1;stroke-dasharray:3 4}.marquee{fill:var(--accent-2);fill-opacity:.08;stroke:var(--accent-2);stroke-width:1;stroke-dasharray:4 4}.message-mask{fill:var(--paper)}.stepping .ds-node,.stepping .ds-edge{transition:opacity .3s ease}.stepping.no-motion .ds-node,.stepping.no-motion .ds-edge{transition:none}.ds-node.is-pending,.ds-edge.is-pending{opacity:.1}.ds-node[data-node-id]{cursor:grab}.ds-node[data-node-id]:focus-visible .card{stroke:var(--accent-2);stroke-width:2.5}.ds-node[data-node-id]:focus{outline:none}.ds-edge[data-edge-id]{cursor:pointer}</style>
